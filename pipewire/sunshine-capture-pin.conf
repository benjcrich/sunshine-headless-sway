# Pin Sunshine's audio capture to the persistent streaming sink.
#
# Sunshine captures "the monitor of the default sink": it sets its audio_sink
# as the system default at stream start and follows default-sink changes.
# restore-default-sink.sh flips the default back to the host device moments
# after connect, which would otherwise drag Sunshine's capture onto host
# audio (host sound in the stream, game sound nowhere).
#
# Install to: ~/.config/pipewire/pipewire-pulse.conf.d/
pulse.rules = [
    {
        matches = [
            {
                application.name = "sunshine"
            }
        ]
        actions = {
            update-props = {
                target.object       = "sink-sunshine-headless"
                node.dont-reconnect = true
            }
        }
    }
]
